apiVersion: v1
kind: Pod
metadata:
  name: nginx-golang
  labels:
    app: nginx-golang
spec:
  restartPolicy: Always
  containers:
    - name: backend
      image: nginx-golang-backend
      ports:
        - containerPort: 80
      livenessProbe:
        httpGet:
          path: "/"
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 30
    - name: proxy
      image: nginx:latest
      ports:
        - containerPort: 80
          hostPort: 80
      volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
  volumes:
    - name: nginx-config
      hostPath:
        path: ./proxy
