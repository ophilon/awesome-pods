apiVersion: v1
kind: Pod
metadata:
  name: nginx-golang-postgres
  labels:
    app: nginx-golang-postgres
spec:
  restartPolicy: Always
  containers:
    - name: db
      image: postgres:latest
      env:
        - name: POSTGRES_DB
          value: "example"
        - name: POSTGRES_PASSWORD
          value: "example"
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      livenessProbe:
        exec:
          command:
            - pg_isready
        initialDelaySeconds: 20
        periodSeconds: 30
    - name: backend
      image: nginx-golang-postgres-backend
      ports:
        - containerPort: 8000
      livenessProbe:
        httpGet:
          path: "/"
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 30
    - name: proxy
      image: nginx:latest
      ports:
        - containerPort: 80
          hostPort: 80
      volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
  volumes:
    - name: db-data
      emptyDir: {}
    - name: nginx-config
      hostPath:
        path: ./proxy
