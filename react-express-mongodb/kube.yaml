apiVersion: v1
kind: Pod
metadata:
  name: react-express-mongodb
  labels:
    app: react-express-mongodb
spec:
  restartPolicy: Always
  containers:
    - name: mongo
      image: mongo:4.2.0
      ports:
        - containerPort: 27017
      volumeMounts:
        - name: mongo-data
          mountPath: /data/db
    - name: backend
      image: react-express-mongodb-backend
      ports:
        - containerPort: 3000
      livenessProbe:
        httpGet:
          path: "/"
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 30
    - name: frontend
      image: react-express-mongodb-frontend
      ports:
        - containerPort: 3000
          hostPort: 3000
      livenessProbe:
        httpGet:
          path: "/"
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 30
  volumes:
    - name: mongo-data
      emptyDir: {}
