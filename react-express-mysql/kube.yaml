apiVersion: v1
kind: Pod
metadata:
  name: react-express-mysql
  labels:
    app: react-express-mysql
spec:
  restartPolicy: Always
  containers:
    - name: db
      image: mariadb:10.6.4-focal
      args:
        - "--default-authentication-plugin=mysql_native_password"
      env:
        - name: MYSQL_DATABASE
          value: "example"
        - name: MYSQL_ROOT_PASSWORD
          value: "example"
      ports:
        - containerPort: 3306
      volumeMounts:
        - name: db-data
          mountPath: /var/lib/mysql
    - name: backend
      image: react-express-mysql-backend
      env:
        - name: DATABASE_DB
          value: "example"
        - name: DATABASE_USER
          value: "root"
        - name: DATABASE_PASSWORD
          value: "example"
        - name: DATABASE_HOST
          value: "db"
        - name: NODE_ENV
          value: "development"
      ports:
        - containerPort: 80
          hostPort: 80
        - containerPort: 9229
          hostPort: 9229
        - containerPort: 9230
          hostPort: 9230
      livenessProbe:
        httpGet:
          path: "/"
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 30
    - name: frontend
      image: react-express-mysql-frontend
      ports:
        - containerPort: 3000
          hostPort: 3000
      livenessProbe:
        httpGet:
          path: "/"
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 30
  volumes:
    - name: db-data
      emptyDir: {}
