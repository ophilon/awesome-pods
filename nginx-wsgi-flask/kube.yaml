apiVersion: v1
kind: Pod
metadata:
  name: nginx-wsgi-flask
  labels:
    app: nginx-wsgi-flask
spec:
  restartPolicy: Always
  containers:
    - name: flask-app
      image: nginx-wsgi-flask-flask
      ports:
        - containerPort: 8000
          hostPort: 8000
      livenessProbe:
        httpGet:
          path: /flask-health-check
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 30
    - name: nginx-proxy
      image: nginx-wsgi-flask-nginx
      env:
        - name: FLASK_SERVER_ADDR
          value: "flask-app:8000"
      ports:
        - containerPort: 80
          hostPort: 80
      volumeMounts:
        - name: nginx-default
          mountPath: /tmp/default.conf
          subPath: default.conf
      livenessProbe:
        httpGet:
          path: /health-check
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 30
  volumes:
    - name: nginx-default
      hostPath:
        path: ./nginx
