apiVersion: v1
kind: Pod
metadata:
  name: react-java-mysql
  labels:
    app: react-java-mysql
spec:
  restartPolicy: Always
  containers:
    - name: db
      image: mariadb:10.6.4-focal
      env:
        - name: MYSQL_DATABASE
          value: "example"
        - name: MYSQL_ROOT_PASSWORD
          value: "example"
      ports:
        - containerPort: 3306
      volumeMounts:
        - name: db-data
          mountPath: /var/lib/mysql
    - name: backend
      image: react-java-mysql-backend
      env:
        - name: MYSQL_HOST
          value: "db"
      ports:
        - containerPort: 8080
      livenessProbe:
        httpGet:
          path: "/"
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 30
    - name: frontend
      image: react-java-mysql-frontend
      ports:
        - containerPort: 3000
          hostPort: 3000
      livenessProbe:
        httpGet:
          path: "/"
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 30
  volumes:
    - name: db-data
      emptyDir: {}
