apiVersion: v1
kind: Pod
metadata:
  name: nginx-flask-mongo
  labels:
    app: nginx-flask-mongo
spec:
  restartPolicy: Always
  containers:
    - name: web
      image: nginx:latest
      env:
        - name: FLASK_SERVER_ADDR
          value: "backend:9091"
      command:
        - /bin/bash
        - -c
        - "envsubst < /tmp/nginx.conf > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
      ports:
        - containerPort: 80
          hostPort: 80
      volumeMounts:
        - name: nginx-config
          mountPath: /tmp/nginx.conf
          subPath: nginx.conf
    - name: backend
      image: nginx-flask-mongo-backend
      env:
        - name: FLASK_SERVER_PORT
          value: "9091"
      ports:
        - containerPort: 9091
      livenessProbe:
        httpGet:
          path: "/"
          port: 9091
        initialDelaySeconds: 10
        periodSeconds: 30
    - name: mongo
      image: mongo:latest
      ports:
        - containerPort: 27017
      volumeMounts:
        - name: mongo-data
          mountPath: /data/db
  volumes:
    - name: nginx-config
      hostPath:
        path: ./nginx
    - name: mongo-data
      emptyDir: {}
