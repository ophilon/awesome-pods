apiVersion: v1
kind: Pod
metadata:
  name: react-nginx
  labels:
    app: react-nginx
spec:
  restartPolicy: Always
  containers:
    - name: frontend
      image: react-nginx-frontend
      ports:
        - containerPort: 80
          hostPort: 80
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 30
